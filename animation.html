<!DOCTYPE html>
<html>
<head>
<style> 
div {
  width: 100px;
  height: 100px;
  background-color: blue;
  animation-name:example;
  animation-duration: 1s;
}

 @keyframes example {
  from {background-color: purple;}
  to {background-color: black;}
}
</style>
</head>
<body>



<div></div>

<p><b>Note:</b> When an animation is finished, it changes back to its original style.</p>

</body>
</html>
